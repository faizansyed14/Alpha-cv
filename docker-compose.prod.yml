# =============================================================================
# AlphaCV, Production (CPU-only)
# Configuration comes exclusively from ./.env.prod (created from .env.prod.example on first run; fill in every CHANGE_ME).
# Start:  ./scripts/start.sh prod        Stop: ./scripts/stop.sh prod
# Volumes are named and are NEVER deleted by the start/stop scripts.
#
# Managed data plane: this stack intentionally runs NO local Postgres and NO
# local file-storage volume. Both live off-box so the EC2 instance holds no
# durable application data and can be replaced/rebuilt/scaled without a data
# migration:
#   - DATABASE_URL -> points at an AWS RDS (PostgreSQL) endpoint: one database
#     for users, candidates, jobs, AI agents and bug reports. Enable "Multi-AZ" + automated backups on
#     the RDS instance itself; see scripts/db/init/rds-bootstrap.sql for the one-time setup.
#   - STORAGE_BACKEND=s3, S3_BUCKET / S3_REGION -> CV/JD files go straight to
#     S3 (credentials via the EC2 instance's IAM role, no static keys on the
#     box). Enable bucket versioning + default SSE-S3/KMS encryption on the
#     bucket itself.
# Sizing for a 4 vCPU / 16 GB host (the limits are ceilings, measured use is far lower): the memory limits add up to ~13.8 GB, which
# leaves ~2 GB for the operating system. A 15,000-CV match was measured at ~250 MiB per match-worker process, the model server idles at
# ~0.9 GB, and Qdrant keeps its vectors on disk. Redis's maxmemory is kept ~25% below its container limit (it needs room for its
# append-only-file rewrite and fragmentation), so it is never killed for going over.
# Qdrant (vector store) and Redis (cache/queue) still run as local containers
# with named volumes, they are not in scope for this migration, but note
# they remain single points of failure on this one EC2 host (see the ops
# notes at the bottom of this file for how to harden them later).
# =============================================================================

# Every container's log is capped: Docker keeps container output forever by default, and nginx also copies each request to stdout, so over
# months the logs would fill the disk. 3 files of 10 MB per container is about 30 MB, and the newest lines are always kept.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    logging: *default-logging
    image: alpha-backend:prod
    build:
      context: ./backend
    env_file:
      - ./.env.prod
    environment:
      # 4 vCPU host: keep the API to 2 workers so the match-worker has cores to run.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      EMBEDDING_SERVICE_URL: http://model-server:8080
      EMBEDDING_SERVICE_TOKEN: ${MODEL_SERVER_TOKEN:-}
      ENABLE_MATCH_QUEUE: "true"
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      model-server:
        condition: service_healthy
    restart: unless-stopped
    # No volumes: STORAGE_BACKEND=s3 means CV/JD files never touch local disk (temp files during parse/preview
    # live in the container's own /tmp and are discarded on restart).
    networks:
      - cv-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json, sys; resp=urllib.request.urlopen('http://localhost:8000/api/health', timeout=5); data=json.loads(resp.read().decode()); sys.exit(0 if data.get('status') in ('healthy','degraded') else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Dedicated matching worker: consumes the Redis match-job queue so the
  # CPU-bound Hungarian/cosine scoring never runs inside the API process.
  # Scale with `--scale match-worker=N` once the host has spare cores.
  match-worker:
    logging: *default-logging
    image: alpha-backend:prod
    pull_policy: never
    command: ["python", "-m", "app.jobs.match_worker"]
    init: true
    # Longer than MATCH_SHUTDOWN_GRACE_SECONDS (100) so running jobs finish or are handed back before Docker kills it.
    stop_grace_period: 120s
    env_file:
      - ./.env.prod
    environment:
      ENABLE_MATCH_QUEUE: "true"
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      EMBEDDING_SERVICE_URL: http://model-server:8080
      EMBEDDING_SERVICE_TOKEN: ${MODEL_SERVER_TOKEN:-}
      # Sizing measured under load (3 users x 15,000 CVs): one match is CPU-bound in a single Python process, so
      # concurrency comes from worker PROCESSES (MATCH_WORKER_REPLICAS). Each process runs up to 2 jobs; the second
      # is only taken when no idle process took it. 4 scoring threads are enough (2-16 measured the same).
      MATCH_THREAD_POOL_WORKERS: ${MATCH_THREAD_POOL_WORKERS:-4}
      MATCH_QUEUE_MAX_CONCURRENT_JOBS: ${MATCH_QUEUE_MAX_CONCURRENT_JOBS:-0}
      MATCH_WORKER_CONCURRENCY: ${MATCH_WORKER_CONCURRENCY:-2}
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      model-server:
        condition: service_healthy
    networks:
      - cv-network
    restart: unless-stopped
    deploy:
      # Default 2 on a 4 vCPU / 16 GB host (m6i.xlarge): serves 2 concurrent large matches while leaving a core
      # for the API, Qdrant and Redis. Set MATCH_WORKER_REPLICAS=3 for three simultaneous heavy matches (tighter on
      # CPU during bursts), or higher once the host has spare cores.
      replicas: ${MATCH_WORKER_REPLICAS:-2}
      resources:
        # per process; a 15,000-CV job peaked at ~250 MiB with the settings above (two jobs ~500 MiB)
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 384M
          cpus: '0.25'

  # Combined background worker: email scheduler + public-CV queue consumer
  # (for /careers public apply). Merged into one container because neither
  # task is CPU-heavy, running them separately just meant two independent
  # copies of the embedding model in RAM for no isolation benefit. Matching
  # (the one genuinely CPU-hungry job) still gets its own dedicated
  # match-worker container above.
  background-worker:
    logging: *default-logging
    image: alpha-backend:prod
    pull_policy: never
    command: ["python", "-m", "app.jobs.background_worker"]
    init: true
    env_file:
      - ./.env.prod
    environment:
      ENABLE_PUBLIC_CV_QUEUE: "true"
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      EMBEDDING_SERVICE_URL: http://model-server:8080
      EMBEDDING_SERVICE_TOKEN: ${MODEL_SERVER_TOKEN:-}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      model-server:
        condition: service_healthy
    networks:
      - cv-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # Embedding model server: the ONE process that holds the embedding model (multilingual-e5-small, ONNX Runtime). The API
  # and the workers call it over the internal network, so the backend image has no ML runtime and the model sits in RAM once.
  # ---------------------------------------------------------------------------
  model-server:
    logging: *default-logging
    image: alpha-model-server:prod
    build:
      context: ./backend/model_server
    environment:
      MODEL_THREADS: ${MODEL_THREADS:-2}
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN:-}
    init: true
    restart: unless-stopped
    networks:
      - cv-network
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_INTERNAL_URL: "http://backend:8000"
        # Set by scripts/start.sh so source edits invalidate the Next.js build layer
        FRONTEND_CACHEBUST: ${FRONTEND_CACHEBUST:-0}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_INTERNAL_URL: "http://backend:8000"
      NODE_ENV: "production"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cv-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 384M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # PostgreSQL: NOT run here in production. DATABASE_URL in ./.env.prod points at an
  # AWS RDS PostgreSQL instance instead (see
  # the header comment above and scripts/db/init/rds-bootstrap.sql for one-time setup:
  # RDS doesn't execute docker-entrypoint-initdb.d, so the application role and
  # its grant have to be created once against the RDS endpoint directly).
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Qdrant (vector store)
  # ---------------------------------------------------------------------------
  qdrant:
    logging: *default-logging
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - cv-network
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=512
      # Optional: require an API key (set QDRANT_API_KEY in .env.prod to enable). The variable is passed ONLY when it has a value: Qdrant
      # treats an empty API key as a key that must be sent, so passing an empty one made every request without a key fail.
      - ${QDRANT_API_KEY:+QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # Redis (cache, rate-limit state, OTP, queue broker)
  # ---------------------------------------------------------------------------
  redis:
    logging: *default-logging
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Optional auth: setting REDIS_PASSWORD in .env.prod makes Redis require it (the
    # backend reads the same var and authenticates). Empty = no password (the
    # service is only reachable on the internal docker network).
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-1536mb}
      --maxmemory-policy volatile-lru
      --tcp-keepalive 60
      --timeout 300
      --maxclients ${REDIS_MAXCLIENTS:-800}
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    networks:
      - cv-network
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # Nginx (only service that publishes ports; DOMAIN comes from .env.prod)
  # ---------------------------------------------------------------------------
  nginx:
    logging: *default-logging
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - nginx_cache:/var/cache/nginx
      # access log on the host for fail2ban (see scripts/system/setup-fail2ban.sh)
      - /var/log/alphacv-nginx:/var/log/nginx
      # SSL (populated by scripts/system/setup-ssl.sh)
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - cv-network
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  # postgres_data / uploads_data intentionally removed: Postgres lives on RDS
  # and CV/JD files live in S3 (see the header comment). Neither the database
  # nor the file store has state on this host anymore.
  qdrant_data:
  redis_data:
  nginx_cache:

networks:
  cv-network:
    driver: bridge

# =============================================================================
# Ops notes, remaining single points of failure on this one-EC2-host layout
# (left as-is here; each is a separate infra decision, not part of this
# RDS/S3 migration):
#   - qdrant_data / redis_data are still local named volumes. If this EC2
#     instance is lost, the vector index (all CVs/JDs/embeddings) and the
#     Redis-backed match-job queue/cache go with it. Mitigate today with a
#     scheduled `docker exec ... snapshot` (Qdrant has a snapshot API) or an
#     EBS snapshot of the volumes; longer-term, Qdrant Cloud or a replicated
#     Qdrant cluster + Amazon ElastiCache remove this host as a SPOF entirely.
#   - Scaling `match-worker` beyond this host (or moving to ECS/Fargate) needs
#     Qdrant/Redis reachable from wherever the new containers land, i.e. they
#     stop being "local containers on the same docker network" and become
#     real network services (managed or on their own host) at that point.
# =============================================================================
