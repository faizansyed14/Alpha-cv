# =============================================================================
# AlphaCV, Local (everything on this machine, data in Docker volumes)
#
# The same services and settings as docker-compose.dev.yml, but nothing leaves the machine:
#   dev    : raw CV files in S3, Postgres on RDS (whatever .env.dev points at)
#   local  : raw CV files in the `uploads-local-data` volume, Postgres in the `postgres-local` container
# The `environment:` blocks below override .env.local, so a copy of the dev settings can never reach S3 or RDS.
#
# Configuration comes from ./.env.local (scripts/start.sh creates it from .env.local.example on first run).
# Start:  ./scripts/start.sh local          Stop: ./scripts/stop.sh local
# Reset:  ./scripts/clean.sh local          (removes this stack's containers, volumes and images)
# Resources (measured idle: about 2.1 GB of RAM and almost no CPU; the limits below are ceilings, not reservations):
#   memory limits add up to ~7.6 GB, so the whole stack fits in an 8 GB Docker VM even if every service peaks at once.
#   Raise them (and MATCH_WORKER_REPLICAS) if your Docker VM has more memory; docker-compose.prod.yml has the production sizes.
# Ports (same as dev, so run one of the two at a time):
#   3000 frontend, 8000 backend, 80 nginx, 5434 postgres, 6335 qdrant, 6380 redis
# =============================================================================

name: alpha-cv-local

# Pins storage and databases to this stack, whatever the env file says.
x-local-storage: &local-storage
  STORAGE_BACKEND: local
  LOCAL_STORAGE_DIR: /data/uploads
  CV_UPLOAD_DIR: /data/uploads/cv
  S3_BUCKET: ""
  S3_REGION: ""
  S3_PREFIX: ""
  # ONE database for users, tracker and email intake
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-local:5432/${POSTGRES_DB:-cv_analyzer_dev}
  QDRANT_HOST: qdrant-local
  QDRANT_PORT: "6333"
  REDIS_HOST: redis-local
  REDIS_PORT: "6379"
  EMBEDDING_SERVICE_URL: http://model-server-local:8080
  # shared secret between the backend processes and the model server (empty = off; set MODEL_SERVER_TOKEN in the env file to turn it on)
  EMBEDDING_SERVICE_TOKEN: ${MODEL_SERVER_TOKEN:-}

services:
  frontend-local:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost
        BACKEND_INTERNAL_URL: http://backend-local:8000
        # Set by scripts/start.sh so source edits invalidate the Next.js build layer
        FRONTEND_CACHEBUST: ${FRONTEND_CACHEBUST:-0}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost
      - BACKEND_INTERNAL_URL=http://backend-local:8000
    depends_on:
      - backend-local
    networks:
      local-network:
        aliases: [frontend-dev]   # nginx/nginx-dev.conf routes to frontend-dev / backend-dev
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
    restart: unless-stopped

  backend-local:
    image: alpha-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      <<: *local-storage
      # 2 API processes, like production (the API only enqueues the heavy work, so more would just share the same cores)
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - ./backend:/app
      - uploads-local-data:/data/uploads
    networks:
      local-network:
        aliases: [backend-dev]
    depends_on:
      postgres-local:
        condition: service_healthy
      qdrant-local:
        condition: service_started
      redis-local:
        condition: service_started
      model-server-local:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: '1.5'
        reservations:
          memory: 384M
    restart: unless-stopped

  # Email scheduler + public-CV queue consumer
  background-worker-local:
    image: alpha-backend:local
    pull_policy: never
    command: ["python", "-m", "app.jobs.background_worker"]
    env_file:
      - .env.local
    environment:
      <<: *local-storage
      ENABLE_PUBLIC_CV_QUEUE: "true"
    depends_on:
      - backend-local
      - postgres-local
      - qdrant-local
      - redis-local
      - model-server-local
    volumes:
      - ./backend:/app
      - uploads-local-data:/data/uploads
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 192M
    restart: unless-stopped

  # Dedicated matching worker (consumes the Redis match-job queue)
  match-worker-local:
    image: alpha-backend:local
    pull_policy: never
    command: ["python", "-m", "app.jobs.match_worker"]
    init: true
    stop_grace_period: 120s
    env_file:
      - .env.local
    environment:
      <<: *local-storage
      ENABLE_MATCH_QUEUE: "true"
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      # Sizing measured under load (3 users x 15,000 CVs): one match is CPU-bound in a single Python process, so
      # concurrency comes from worker PROCESSES (MATCH_WORKER_REPLICAS). Each process runs up to 2 jobs; the second
      # is only taken when no idle process took it. 4 scoring threads are enough (2-16 measured the same).
      MATCH_THREAD_POOL_WORKERS: ${MATCH_THREAD_POOL_WORKERS:-4}
      MATCH_QUEUE_MAX_CONCURRENT_JOBS: ${MATCH_QUEUE_MAX_CONCURRENT_JOBS:-0}
      MATCH_WORKER_CONCURRENCY: ${MATCH_WORKER_CONCURRENCY:-2}
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    depends_on:
      - backend-local
      - postgres-local
      - qdrant-local
      - redis-local
      - model-server-local
    volumes:
      - ./backend:/app
      - uploads-local-data:/data/uploads
    networks:
      - local-network
    deploy:
      replicas: ${MATCH_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M
    restart: unless-stopped

  # Embedding model server: the only process with the embedding model, multilingual-e5-small on ONNX Runtime (internal, no host port)
  model-server-local:
    image: alpha-model-server:local
    build:
      context: ./backend/model_server
    environment:
      - MODEL_THREADS=${MODEL_THREADS:-2}
      - MODEL_SERVER_TOKEN=${MODEL_SERVER_TOKEN:-}
    init: true
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'
        reservations:
          memory: 384M
    restart: unless-stopped

  postgres-local:
    image: postgres:15
    # Memory settings: the defaults below are PostgreSQL's own (small, fine for a few thousand CVs). With more data raise them in
    # .env.local, together with POSTGRES_MEMORY_LIMIT (shared_buffers + work_mem x connections must fit inside it). A common rule:
    # shared_buffers = 25% of the memory you give the container, effective_cache_size = 50-75%.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cv_analyzer_dev}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-384M}
          cpus: '1.0'
        reservations:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant-local:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-local-data:/qdrant/storage
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
    restart: unless-stopped

  # Redis keeps its data in a volume (append-only), so queued matches and caches survive a restart
  redis-local:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-local-data:/data
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: '0.5'
        reservations:
          memory: 64M
    restart: unless-stopped

  nginx-local:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-local
      - frontend-local
    networks:
      - local-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    restart: unless-stopped

networks:
  local-network:
    driver: bridge

volumes:
  postgres-local-data:
  qdrant-local-data:
  redis-local-data:
  uploads-local-data:
