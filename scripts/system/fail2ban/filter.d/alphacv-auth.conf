# Failed sign-in traffic: wrong password / blocked / throttled answers on the sign-in endpoints.
# Log format: nginx "combined"  ->  203.0.113.9 - - [10/Nov/2026:07:15:24 +0000] "POST /api/auth/verify-password HTTP/1.1" 401 123 "-" "UA"
# (fail2ban cuts the [timestamp] out before matching, hence the ".*" after the "-")
[Definition]
failregex = ^<HOST> -.*"(?:POST|GET) /api/auth/[^"]*" (?:401|403|429)
# an expired session on /me or /logout is not an attack
ignoreregex = ^<HOST> -.*"[A-Z]+ /api/auth/(?:me|logout)[^"]*"
