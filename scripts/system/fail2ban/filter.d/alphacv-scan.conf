# Scanners: a client that keeps asking for things that do not exist or that it may not touch (400 / 403 / 404 / 405 / 444).
[Definition]
failregex = ^<HOST> -.*"[A-Z]+ [^"]*" (?:400|403|404|405|444)
# an applicant's page polls this and gets 404 until processing starts; a stale job link is a 404 too
ignoreregex = ^<HOST> -.*"GET /api/careers/(?:applications/\S+/status|jobs/\S+)[ ?]
