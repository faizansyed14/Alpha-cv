# Alembic configuration — two isolated migration streams:
#   alembic -n auth    ...   (users / auth_db, URL from AUTH_DB_URL)
#   alembic -n tracker ...   (tracker + follow-ups, URL from TRACKER_DB_URL)
#
# Typical workflow (run inside alpha-backend/, env vars loaded):
#   alembic -n auth revision --autogenerate -m "add column x"
#   alembic -n auth upgrade head
#
# The app still calls SQLModel create_all at startup for first-boot
# bootstrap; Alembic is the tool for evolving existing production schemas.

[auth]
script_location = migrations/auth
version_table = alembic_version
prepend_sys_path = .

[tracker]
script_location = migrations/tracker
version_table = alembic_version
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
