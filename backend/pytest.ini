[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Coverage is opt-in (pytest --cov=app --cov-report=term-missing): it must not write htmlcov/ or coverage.xml on every run.
addopts =
    --verbose
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security-related tests
    auth: Authentication tests
