# Alembic: ONE migration history for the single application database (users, tracker, email intake).
#
#   alembic upgrade head                              apply every migration (the app does this at startup)
#   alembic revision --autogenerate -m "add x"        after changing a model in app/models
#
# Run inside backend/ with DATABASE_URL set. The database URL is read from the app settings (see migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
