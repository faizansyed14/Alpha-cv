# =============================================================================
# AlphaCV, Development (CPU-only)
# Configuration comes from ./.env.dev (created from .env.dev.example on first run).
# Start:  ./scripts/start.sh dev         Stop: ./scripts/stop.sh dev
# Exposed dev ports: 3000 frontend, 8000 backend, 80 nginx,
#                    5434 postgres, 6335 qdrant, 6380 redis.
# =============================================================================

services:
  # Development Frontend (port 3000). The browser uses window.location.origin at
  # runtime, so NEXT_PUBLIC_API_URL only matters for the SSR fallback.
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost
        BACKEND_INTERNAL_URL: http://backend-dev:8000
        # Set by scripts/start.sh so source edits invalidate the Next.js build layer
        FRONTEND_CACHEBUST: ${FRONTEND_CACHEBUST:-0}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost
      # Server-side rewrite proxy: Next.js forwards /api/* to this URL.
      - BACKEND_INTERNAL_URL=http://backend-dev:8000
    depends_on:
      - backend-dev
    networks:
      - dev-network
    restart: unless-stopped

  # Development Backend (port 8000, CPU-only PyTorch, hot-reload source mount)
  backend-dev:
    image: alpha-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - EMBEDDING_SERVICE_URL=http://model-server-dev:8080
    volumes:
      - ./backend:/app
      - uploads-dev-data:/data/uploads
    networks:
      - dev-network
    depends_on:
      - postgres-dev
      - qdrant-dev
      - redis-dev
      - model-server-dev
    restart: unless-stopped

  # Combined background worker: email scheduler + public-CV queue consumer.
  # Merged (see docker-compose.prod.yml for why), match-worker-dev below
  # stays separate since it's the only genuinely CPU-heavy one.
  background-worker-dev:
    image: alpha-backend:dev
    pull_policy: never
    command: ["python", "-m", "app.jobs.background_worker"]
    env_file:
      - .env.dev
    environment:
      - EMBEDDING_SERVICE_URL=http://model-server-dev:8080
      - ENABLE_PUBLIC_CV_QUEUE=true
    depends_on:
      - backend-dev
      - postgres-dev
      - qdrant-dev
      - redis-dev
      - model-server-dev
    volumes:
      - ./backend:/app
      - uploads-dev-data:/data/uploads
    networks:
      - dev-network
    restart: unless-stopped

  # Dedicated matching worker (consumes the Redis match-job queue)
  match-worker-dev:
    image: alpha-backend:dev
    pull_policy: never
    command: ["python", "-m", "app.jobs.match_worker"]
    init: true
    stop_grace_period: 120s
    env_file:
      - .env.dev
    environment:
      - EMBEDDING_SERVICE_URL=http://model-server-dev:8080
      - ENABLE_MATCH_QUEUE=true
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-1}
      - MATCH_THREAD_POOL_WORKERS=${MATCH_THREAD_POOL_WORKERS:-4}
      - MATCH_QUEUE_MAX_CONCURRENT_JOBS=${MATCH_QUEUE_MAX_CONCURRENT_JOBS:-0}
      - MATCH_WORKER_CONCURRENCY=${MATCH_WORKER_CONCURRENCY:-2}
      - OPENBLAS_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    depends_on:
      - backend-dev
      - postgres-dev
      - qdrant-dev
      - redis-dev
      - model-server-dev
    volumes:
      - ./backend:/app
      - uploads-dev-data:/data/uploads
    networks:
      - dev-network
    deploy:
      replicas: ${MATCH_WORKER_REPLICAS:-2}
    restart: unless-stopped

  # Embedding model server (multilingual-e5-small on ONNX Runtime lives ONLY here; internal, no host port)
  model-server-dev:
    image: alpha-model-server:dev
    build:
      context: ./backend/model_server
    environment:
      - MODEL_THREADS=${MODEL_THREADS:-2}
    init: true
    networks:
      - dev-network
    restart: unless-stopped

  # Development PostgreSQL (host port 5434)
  postgres-dev:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cv_analyzer_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Development Qdrant (host port 6335)
  qdrant-dev:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6335:6333"
    volumes:
      - qdrant-dev-data:/qdrant/storage
    networks:
      - dev-network
    restart: unless-stopped

  # Development Redis (host port 6380)
  redis-dev:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    networks:
      - dev-network
    restart: unless-stopped

  # Development Nginx - reverse proxy (same routing as prod)
  nginx-dev:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  qdrant-dev-data:
  uploads-dev-data:
