# =============================================================================
# AlphaCV — Development (CPU-only)
# Configuration comes from ./.env.dev (copy .env.development.example).
# Start:  ./scripts/start.sh dev         Stop: ./scripts/stop.sh dev
# Exposed dev ports: 3000 frontend, 8000 backend, 80 nginx,
#                    5434 postgres, 6335 qdrant, 6380 redis.
# =============================================================================

services:
  # Development Frontend (port 3000). The browser uses window.location.origin at
  # runtime, so NEXT_PUBLIC_API_URL only matters for the SSR fallback.
  frontend-dev:
    build:
      context: ./cv-analyzer-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost
        BACKEND_INTERNAL_URL: http://backend-dev:8000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost
      # Server-side rewrite proxy: Next.js forwards /api/* to this URL.
      - BACKEND_INTERNAL_URL=http://backend-dev:8000
    depends_on:
      - backend-dev
    networks:
      - dev-network
    restart: unless-stopped

  # Development Backend (port 8000, CPU-only PyTorch, hot-reload source mount)
  backend-dev:
    build:
      context: ./alpha-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    volumes:
      - ./alpha-backend:/app
      - uploads-dev-data:/data/uploads
      - llm-cache-dev:/data/llm_cache
    networks:
      - dev-network
    depends_on:
      - postgres-dev
      - qdrant-dev
      - redis-dev
    restart: unless-stopped

  # Combined background worker: email scheduler + public-CV queue consumer.
  # Merged (see docker-compose.prod.yml for why) — match-worker-dev below
  # stays separate since it's the only genuinely CPU-heavy one.
  background-worker-dev:
    build:
      context: ./alpha-backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.background_worker"]
    env_file:
      - .env.dev
    environment:
      - ENABLE_EMAIL_SCHEDULER=true
      - ENABLE_PUBLIC_CV_QUEUE=true
    depends_on:
      - backend-dev
      - postgres-dev
      - qdrant-dev
      - redis-dev
    volumes:
      - ./alpha-backend:/app
      - uploads-dev-data:/data/uploads
      - llm-cache-dev:/data/llm_cache
    networks:
      - dev-network
    restart: unless-stopped

  # Dedicated matching worker (consumes the Redis match-job queue)
  match-worker-dev:
    build:
      context: ./alpha-backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.match_worker"]
    env_file:
      - .env.dev
    environment:
      - ENABLE_MATCH_QUEUE=true
      - TORCH_NUM_THREADS=1
    depends_on:
      - backend-dev
      - postgres-dev
      - qdrant-dev
      - redis-dev
    volumes:
      - ./alpha-backend:/app
      - uploads-dev-data:/data/uploads
      - llm-cache-dev:/data/llm_cache
    networks:
      - dev-network
    restart: unless-stopped

  # Development PostgreSQL (host port 5434)
  postgres-dev:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cv_analyzer_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Development Qdrant (host port 6335)
  qdrant-dev:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6335:6333"
    volumes:
      - qdrant-dev-data:/qdrant/storage
    networks:
      - dev-network
    restart: unless-stopped

  # Development Redis (host port 6380)
  redis-dev:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - dev-network
    restart: unless-stopped

  # Development Nginx - reverse proxy (same routing as prod)
  nginx-dev:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  qdrant-dev-data:
  uploads-dev-data:
  llm-cache-dev:
