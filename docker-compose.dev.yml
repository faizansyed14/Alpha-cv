# =============================================================================
# AlphaCV, Development (CPU-only)
#
# The same services, sizes and settings as docker-compose.local.yml. The only differences:
#   local : raw CV files in the `uploads-local-data` volume, Postgres in the `postgres-local` container
#   dev   : raw CV files in S3, Postgres on RDS (STORAGE_BACKEND, S3_*, DATABASE_URL come from .env.dev)
# Configuration comes from ./.env.dev (created from .env.dev.example on first run).
# Start:  ./scripts/start.sh dev         Stop: ./scripts/stop.sh dev
# Resources (measured idle: about 2 GB of RAM and almost no CPU; the limits are ceilings, not reservations):
#   memory limits add up to ~7.2 GB. docker-compose.prod.yml has the production sizes.
# Ports (same as local, so run one of the two at a time):
#   3000 frontend, 8000 backend, 80 nginx, 6335 qdrant, 6380 redis
# =============================================================================

# What every backend process is told about its neighbours in this stack (the database and the file store come from .env.dev).
x-dev-services: &dev-services
  QDRANT_HOST: qdrant-dev
  QDRANT_PORT: "6333"
  REDIS_HOST: redis-dev
  REDIS_PORT: "6379"
  EMBEDDING_SERVICE_URL: http://model-server-dev:8080
  # shared secret between the backend processes and the model server (empty = off; set MODEL_SERVER_TOKEN in the env file to turn it on)
  EMBEDDING_SERVICE_TOKEN: ${MODEL_SERVER_TOKEN:-}

services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost
        BACKEND_INTERNAL_URL: http://backend-dev:8000
        # Set by scripts/start.sh so source edits invalidate the Next.js build layer
        FRONTEND_CACHEBUST: ${FRONTEND_CACHEBUST:-0}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost
      - BACKEND_INTERNAL_URL=http://backend-dev:8000
    depends_on:
      - backend-dev
    networks:
      dev-network:
        aliases: [frontend-dev]   # nginx/nginx-dev.conf routes to frontend-dev / backend-dev
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
    restart: unless-stopped

  backend-dev:
    image: alpha-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      <<: *dev-services
      # 2 API processes, like production (the API only enqueues the heavy work, so more would just share the same cores)
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - ./backend:/app
    networks:
      dev-network:
        aliases: [backend-dev]
    depends_on:
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
      model-server-dev:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: '1.5'
        reservations:
          memory: 384M
    restart: unless-stopped

  # Email scheduler + public-CV queue consumer
  background-worker-dev:
    image: alpha-backend:dev
    pull_policy: never
    command: ["python", "-m", "app.jobs.background_worker"]
    env_file:
      - .env.dev
    environment:
      <<: *dev-services
      ENABLE_PUBLIC_CV_QUEUE: "true"
    depends_on:
      - backend-dev
      - qdrant-dev
      - redis-dev
      - model-server-dev
    volumes:
      - ./backend:/app
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 192M
    restart: unless-stopped

  # Dedicated matching worker (consumes the Redis match-job queue)
  match-worker-dev:
    image: alpha-backend:dev
    pull_policy: never
    command: ["python", "-m", "app.jobs.match_worker"]
    init: true
    stop_grace_period: 120s
    env_file:
      - .env.dev
    environment:
      <<: *dev-services
      ENABLE_MATCH_QUEUE: "true"
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      # Sizing measured under load (3 users x 15,000 CVs): one match is CPU-bound in a single Python process, so
      # concurrency comes from worker PROCESSES (MATCH_WORKER_REPLICAS). Each process runs up to 2 jobs; the second
      # is only taken when no idle process took it. 4 scoring threads are enough (2-16 measured the same).
      MATCH_THREAD_POOL_WORKERS: ${MATCH_THREAD_POOL_WORKERS:-4}
      MATCH_QUEUE_MAX_CONCURRENT_JOBS: ${MATCH_QUEUE_MAX_CONCURRENT_JOBS:-0}
      MATCH_WORKER_CONCURRENCY: ${MATCH_WORKER_CONCURRENCY:-2}
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    depends_on:
      - backend-dev
      - qdrant-dev
      - redis-dev
      - model-server-dev
    volumes:
      - ./backend:/app
    networks:
      - dev-network
    deploy:
      # Default 2: serves 2 concurrent large matches while leaving a core for the API, Qdrant and Redis.
      # Set MATCH_WORKER_REPLICAS=3 for three simultaneous heavy matches, or higher once the host has spare cores.
      replicas: ${MATCH_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M
    restart: unless-stopped

  # Embedding model server: the only process with the embedding model, multilingual-e5-small on ONNX Runtime (internal, no host port)
  model-server-dev:
    image: alpha-model-server:dev
    build:
      context: ./backend/model_server
    environment:
      - MODEL_THREADS=${MODEL_THREADS:-2}
      - MODEL_SERVER_TOKEN=${MODEL_SERVER_TOKEN:-}
    init: true
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.5'
        reservations:
          memory: 384M
    restart: unless-stopped

  qdrant-dev:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-dev-data:/qdrant/storage
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
    restart: unless-stopped

  # Redis keeps its data in a volume (append-only), so queued matches and caches survive a restart
  redis-dev:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-dev-data:/data
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: '0.5'
        reservations:
          memory: 64M
    restart: unless-stopped

  nginx-dev:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 16M
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge

volumes:
  qdrant-dev-data:
  redis-dev-data:
